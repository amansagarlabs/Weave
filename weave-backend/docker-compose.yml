services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: weave
      POSTGRES_USER: weave
      POSTGRES_PASSWORD: weave
    ports:
      - "5433:5432"
    volumes:
      - weave-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weave -d weave"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/weave
      DATABASE_USERNAME: weave
      DATABASE_PASSWORD: weave
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-to-at-least-32-characters}
      AUTH_AUDIT_HASH_SECRET: ${AUTH_AUDIT_HASH_SECRET:-change-this-development-audit-secret}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-weave-assets}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-weave-minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-this-minio-password}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-http://localhost:9000/weave-assets}
      S3_MAX_UPLOAD_BYTES: ${S3_MAX_UPLOAD_BYTES:-26214400}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@weave.local}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-smtp}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_API_BASE_URL: ${RESEND_API_BASE_URL:-https://api.resend.com}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      UNIBEE_BASE_URL: ${WEAVE_UNIBEE_BASE_URL:-http://host.docker.internal:8088}
      UNIBEE_API_KEY: ${WEAVE_UNIBEE_API_KEY:-}
      UNIBEE_PAYMENT_GATEWAY_ID: ${WEAVE_UNIBEE_PAYMENT_GATEWAY_ID:-0}
      UNIBEE_PAYMENT_TYPE: ${WEAVE_UNIBEE_PAYMENT_TYPE:-}
      AUTH_EMAIL_VERIFICATION_LIFETIME: ${AUTH_EMAIL_VERIFICATION_LIFETIME:-PT24H}
      AUTH_REFRESH_LIFETIME: ${AUTH_REFRESH_LIFETIME:-P30D}
      AUTH_SECURE_COOKIES: ${AUTH_SECURE_COOKIES:-false}
      GOOGLE_LOGIN_ENABLED: ${GOOGLE_LOGIN_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-http://192.168.*:3000}
      REALTIME_ALLOWED_ORIGINS: ${REALTIME_ALLOWED_ORIGINS:-http://localhost:3000}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-weave-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-this-minio-password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - weave-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - weave-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio-init:
    image: ${MINIO_CLIENT_IMAGE:-minio/mc:latest}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command: -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} && mc mb --ignore-existing local/$${MINIO_BUCKET} && mc anonymous set download local/$${MINIO_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-weave-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-this-minio-password}
      MINIO_BUCKET: ${S3_BUCKET:-weave-assets}

  mailpit:
    image: ${MAILPIT_IMAGE:-axllent/mailpit:latest}
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  weave-postgres:
  weave-minio:
  weave-redis:
